name: Madame Web CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check if lint would modify files
        run: |
          git diff --exit-code
          if [ $? -ne 0 ]; then
            echo "Lint would modify files. Please run 'npm run lint' locally and commit the changes."
            exit 1
          fi

      - name: Run tests
        run: npm run test:coverage -- --run
